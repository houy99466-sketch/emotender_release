  <ellipse cx="160.0" cy="60" rx="50.0" ry="8" fill="none" stroke="black" stroke-width="2.5"/>
  
  <!-- Lid -->
  <path d="M105 55 Q160.0 40 215 55" fill="none" stroke="black" stroke-width="2"/>
  <ellipse cx="160.0" cy="55" rx="55.0" ry="5" fill="none" stroke="black" stroke-width="2"/>
  
  <!-- Straw -->
  <line x1="180.0" y1="30" x2="175.0" y2="240" stroke="black" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M180.0 30 L195.0 15" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Layers -->
  <line x1="115" y1="140.0" x2="205" y2="140.0" stroke="black" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="230" y="145.0" font-family="sans-serif" font-size="11" fill="#555">葡萄果肉</text>
  <line x1="115" y1="200.0" x2="205" y2="200.0" stroke="black" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="230" y="205.0" font-family="sans-serif" font-size="11" fill="#555">冰沙</text>
  <line x1="115" y1="260.0" x2="205" y2="260.0" stroke="black" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="230" y="265.0" font-family="sans-serif" font-size="11" fill="#555">奶盖</text>
  <circle cx="130" cy="75" r="6" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="140" y="79" font-family="sans-serif" font-size="10" fill="#555">葡萄粒</text>
  
  <!-- Drink name -->
  <text x="160.0" y="370" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="black">多肉葡萄</text>
  <text x="160.0" y="390" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#888">EmoTender</text>
